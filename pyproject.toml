[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bgsl"
version = "0.1.0"
description = "Biological Gradient Supervised Learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "jsonargparse[signatures]>=4.20.0",
    "torchmetrics>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "lmdb>=1.4.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
logging = ["wandb>=0.16.0", "tensorboard>=2.14.0"]
data = [
    "kagglehub>=0.2.0",
    "huggingface_hub>=0.20.0",
    "filelock>=3.12.0",
]

[project.scripts]
bgsl-train = "bgsl.cli:main"
bgsl-acquire = "bgsl.data.sepsis.acquisition_cli:main"
bgsl-upload = "bgsl.data.sepsis.upload_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bgsl"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
ignore_missing_imports = true
strict = false
check_untyped_defs = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]
