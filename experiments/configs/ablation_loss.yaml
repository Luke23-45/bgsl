# experiments/configs/ablation_loss.yaml
# -----------------------------------------------
# Full loss ablation matrix.
# Run via: python experiments/run_ablation.py --config ablation_loss.yaml

_base_: "physionet_gru.yaml"

ablation:
  name: "loss_ablation"
  vary: "loss.name"

  conditions:
    - name: "bce"
      loss:
        class_path: "bgsl.core.common.losses.BCELoss"

    - name: "weighted_bce"
      loss:
        class_path: "bgsl.core.common.losses.WeightedBCELoss"
        init_args:
          pos_weight: 10.0

    - name: "focal"
      loss:
        class_path: "bgsl.core.common.losses.FocalLoss"
        init_args:
          gamma: 2.0

    - name: "tls"
      loss:
        class_path: "bgsl.core.common.losses.TLSLoss"
        init_args:
          alpha: 6.0

    - name: "smoothness"
      loss:
        class_path: "bgsl.core.common.losses.SmoothnessLoss"
        init_args:
          smoothness_weight: 0.1

    - name: "tv"
      loss:
        class_path: "bgsl.core.common.losses.TotalVariationLoss"
        init_args:
          tv_weight: 0.1

    - name: "bgsl_state_only"
      loss:
        class_path: "bgsl.core.common.losses.BGSLLoss"
        init_args:
          state_loss: "bce"
          derivative_space: "probability"
          velocity_weight: 0.0
          acceleration_weight: 0.0

    - name: "bgsl_velocity_only"
      loss:
        class_path: "bgsl.core.common.losses.BGSLLoss"
        init_args:
          state_loss: "bce"
          derivative_space: "probability"
          velocity_weight: 0.1
          acceleration_weight: 0.0

    - name: "bgsl_accel_only"
      loss:
        class_path: "bgsl.core.common.losses.BGSLLoss"
        init_args:
          state_loss: "bce"
          derivative_space: "probability"
          velocity_weight: 0.0
          acceleration_weight: 0.05

    - name: "bgsl_full"
      loss:
        class_path: "bgsl.core.common.losses.BGSLLoss"
        init_args:
          state_loss: "bce"
          derivative_space: "probability"
          velocity_weight: 0.1
          acceleration_weight: 0.05

    - name: "bgsl_uwso"
      loss:
        class_path: "bgsl.core.common.losses.BGSLLoss"
        init_args:
          state_loss: "bce"
          derivative_space: "probability"
          weighting_method: "uw_so"
          temperature: 1.0

    - name: "bgsl_uw"
      loss:
        class_path: "bgsl.core.common.losses.BGSLLoss"
        init_args:
          state_loss: "bce"
          derivative_space: "probability"
          weighting_method: "uw"

  seeds: [42, 43, 44]
