# experiments/configs/ablation_lambda.yaml
# -----------------------------------------------
# Lambda (velocity_weight, acceleration_weight) grid search ablation.
# plan §9.2, §15.2 Table 6.

_base_: "physionet_gru.yaml"

ablation:
  name: "lambda_ablation"
  vary: ["loss.velocity_weight", "loss.acceleration_weight"]

  conditions:
    # Lambda_v grid (lambda_a fixed at 0.05)
    - name: "lv_0.01_la_0.05"
      loss: {name: "bgsl", velocity_weight: 0.01, acceleration_weight: 0.05}
    - name: "lv_0.05_la_0.05"
      loss: {name: "bgsl", velocity_weight: 0.05, acceleration_weight: 0.05}
    - name: "lv_0.10_la_0.05"
      loss: {name: "bgsl", velocity_weight: 0.10, acceleration_weight: 0.05}
    - name: "lv_0.25_la_0.05"
      loss: {name: "bgsl", velocity_weight: 0.25, acceleration_weight: 0.05}
    - name: "lv_0.50_la_0.05"
      loss: {name: "bgsl", velocity_weight: 0.50, acceleration_weight: 0.05}

    # Lambda_a grid (lambda_v fixed at 0.1)
    - name: "lv_0.10_la_0.00"
      loss: {name: "bgsl", velocity_weight: 0.10, acceleration_weight: 0.00}
    - name: "lv_0.10_la_0.01"
      loss: {name: "bgsl", velocity_weight: 0.10, acceleration_weight: 0.01}
    - name: "lv_0.10_la_0.10"
      loss: {name: "bgsl", velocity_weight: 0.10, acceleration_weight: 0.10}
    - name: "lv_0.10_la_0.25"
      loss: {name: "bgsl", velocity_weight: 0.10, acceleration_weight: 0.25}

  seeds: [42, 123, 456]
