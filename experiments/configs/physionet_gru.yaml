# experiments/configs/physionet_gru.yaml
# LightningCLI compatible configuration for GRU

seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  max_epochs: 50
  gradient_clip_val: 5.0
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "checkpoints"
        filename: "gru-{epoch:02d}-{val_auprc:.4f}"
        monitor: "val_auprc"
        mode: "max"
        save_top_k: 1
        save_last: true
    - class_path: pytorch_lightning.callbacks.EarlyStopping
      init_args:
        monitor: "val_auprc"
        patience: 10
        mode: "max"
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: "step"

data:
  class_path: bgsl.data.datamodule.PhysioNetDataModule
  init_args:
    data_dir: "sepsis_clinical_28/physionet_2019_processed"
    horizon_hours: 6
    tau: 2.0
    min_length: 8
    batch_size: 16
    num_workers: 4
    pin_memory: true
    pos_weight_sampler: 5.0
    enable_normalizer: true
    normalizer_epsilon: 1.0e-6
    normalizer_safety_margin: 0.05

model:
  class_path: bgsl.models.lightning.BGSLLightningModule
  init_args:
    horizon_hours: 6
    lr: 1.0e-3
    weight_decay: 1.0e-4
    epochs: 50
    lr_scheduler: "cosine"
    model:
      class_path: bgsl.models.gru.GRUPredictor
      init_args:
        input_dim: 28
        hidden_dim: 128
        num_layers: 2
        dropout: 0.2
        use_mask_as_input: true
    loss_fn:
      class_path: bgsl.core.losses.BGSLLoss
      init_args:
        state_loss: "bce"
        velocity_weight: 0.1
        acceleration_weight: 0.05
        derivative_space: "probability"
