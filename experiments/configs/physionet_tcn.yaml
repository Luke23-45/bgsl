# experiments/configs/physionet_tcn.yaml
# LightningCLI compatible configuration for TCN

seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  enable_progress_bar: true
  max_epochs: 50
  gradient_clip_val: 5.0
  callbacks:
    - class_path: bgsl.utils.progress.CloudProgressBar
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "checkpoints"
        filename: "tcn-{epoch:02d}-{val_auprc:.4f}"
        monitor: "val_auprc"
        mode: "max"
        save_top_k: 1
        save_last: true
    - class_path: pytorch_lightning.callbacks.EarlyStopping
      init_args:
        monitor: "val_auprc"
        patience: 10
        mode: "max"

data:
  data_dir: "sepsis_clinical_28/physionet_2019_processed"
  horizon_hours: 6
  tau: 2.0
  min_length: 8
  batch_size: 16
  num_workers: 0
  pin_memory: false
    pos_weight_sampler: 5.0

model:
  horizon_hours: 6
  lr: 5.0e-4
  weight_decay: 1.0e-4
  epochs: 50
  lr_scheduler: "cosine"
  model:
    class_path: bgsl.models.tcn.TCNPredictor
    init_args:
      input_dim: 28
      n_filters: 128
      kernel_size: 3
      n_layers: 6
      dropout: 0.2
      use_mask_as_input: true
  loss_fn:
    class_path: bgsl.core.losses.BGSLLoss
    init_args:
      state_loss: "bce"
      velocity_weight: 0.1
      acceleration_weight: 0.05
      derivative_space: "probability"
