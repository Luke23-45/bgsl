# experiments/configs/physionet_transformer.yaml
# LightningCLI compatible configuration for Transformer

seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  max_epochs: 50
  gradient_clip_val: 1.0
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "checkpoints"
        filename: "transformer-{epoch:02d}-{val_auprc:.4f}"
        monitor: "val_auprc"
        mode: "max"
        save_top_k: 1
        save_last: true
    - class_path: pytorch_lightning.callbacks.EarlyStopping
      init_args:
        monitor: "val_auprc"
        patience: 10
        mode: "max"

data:
  class_path: bgsl.data.datamodule.PhysioNetDataModule
  init_args:
    data_dir: "data/ready"
    horizon_hours: 6
    tau: 2.0
    min_length: 8
    batch_size: 16
    num_workers: 4
    pin_memory: true
    pos_weight_sampler: 5.0

model:
  class_path: bgsl.models.lightning.BGSLLightningModule
  init_args:
    horizon_hours: 6
    lr: 5.0e-4
    weight_decay: 1.0e-4
    epochs: 50
    lr_scheduler: "cosine"
    model:
      class_path: bgsl.models.transformer.TransformerPredictor
      init_args:
        input_dim: 28
        d_model: 128
        n_heads: 4
        n_layers: 4
        dim_feedforward: 256
        dropout: 0.1
        max_seq_len: 512
        use_mask_as_input: true
    loss_fn:
      class_path: bgsl.core.losses.BGSLLoss
      init_args:
        state_loss: "bce"
        velocity_weight: 0.1
        acceleration_weight: 0.05
        derivative_space: "probability"
