# experiments/configs/physionet_transformer.yaml
# LightningCLI compatible configuration for Transformer

seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  enable_progress_bar: true
  max_epochs: 30
  gradient_clip_val: 1.0
  callbacks:
    - class_path: bgsl.utils.progress.CloudProgressBar
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "checkpoints"
        filename: "transformer-{epoch:02d}-{val_loss:.4f}"
        monitor: "val_loss"
        mode: "min"
        save_top_k: 1
        save_last: true
    - class_path: pytorch_lightning.callbacks.EarlyStopping
      init_args:
        monitor: "val_loss"
        patience: 6
        mode: "min"
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: "step"

data:
  data_dir: "sepsis_clinical_40/physionet_2019_processed"
  horizon_hours: 6
  tau: 2.0
  min_length: 8
  batch_size: 16
  num_workers: 2
  pin_memory: false
  enable_normalizer: true
  normalizer_epsilon: 1.0e-6
  normalizer_safety_margin: 0.05

model:
  horizon_hours: 6
  lr: 5.0e-4
  weight_decay: 1.0e-4
  epochs: 30
  lr_scheduler: "cosine"
  model:
    class_path: bgsl.models.transformer.TransformerPredictor
    init_args:
      d_model: 64
      n_heads: 4
      n_layers: 2
      dim_feedforward: 128
      dropout: 0.20
      max_seq_len: 512
      use_mask_as_input: true
  loss_fn:
    class_path: bgsl.core.common.losses.BCELoss
    init_args: {}
